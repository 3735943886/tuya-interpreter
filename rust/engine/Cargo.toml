[package]
name = "tuya-interpreter"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Portable Tuya device interpreter: schemas and DPS to intermediate device semantics"
repository = "https://github.com/3735943886/tuya-interpreter"
readme = "../../README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.11"
