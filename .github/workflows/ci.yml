name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: pip install -e ".[test]"
      - run: pip install ruff==0.16.8 && ruff check src tests hatch_version.py
      - run: python -m pytest -q

  portable:
    # The engine as WebAssembly, driven from JavaScript with the same rule pack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --manifest-path rust/Cargo.toml --release --target wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node bindings/js/smoke.mjs
