name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: pip install -e ".[test]" tuyamock==0.0.6
      - run: pip install ruff==0.16.8 && ruff check src tests hatch_version.py
      - run: python -m pytest -q

  portable:
    # The engine as WebAssembly, driven from JavaScript with the same rule pack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --manifest-path rust/Cargo.toml --release --target wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node bindings/js/smoke.mjs

  rust-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest tuyamock==0.0.6
      - run: cargo build --manifest-path examples/rust/Cargo.toml
      - run: cargo fmt --manifest-path examples/rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path examples/rust/Cargo.toml --all-targets -- -D warnings
      - run: python -m pytest tests/test_rust_toggle_cli.py -q
        env:
          TUYA_RUST_TOGGLE_BIN: examples/rust/target/debug/tuya-interpreter-toggle-example
