[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tuya2ildevice"
dynamic = ["version"]
description = "Sans-IO converter: Tuya (rustuya / rustuya-bridge) device + DPS packets <-> ildevice descriptor, values and commands"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Topic :: Home Automation", "Programming Language :: Rust"]

[project.urls]
Repository = "https://github.com/3735943886/tuya2ildevice"

[project.optional-dependencies]
test = ["pytest", "jsonschema", "tuya-device-sharing-sdk==0.2.15", "cryptography"]      # the oracle tests/test_adapter.py checks the value conversions against

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/tuya2ildevice"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "docs", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "hatch_build.py", "rust", "rules", "bindings"]
exclude = ["rust/target"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
required-version = ">=0.16"      # CI pins 0.16.8; older ones disagree on some rules

[tool.cibuildwheel]
# The C ABI is independent of Python's ABI: one py3-none wheel per platform.
build = "cp311-*"
test-requires = ["pytest"]
# jsonschema's rpds dependency has no ARMv7 musl wheel; schema parity runs in the full test job.
test-command = 'python -m pytest {project}/tests/test_native.py {project}/tests/test_rules.py --override-ini=pythonpath= -q -k "not canonical_rule_pack_validates_against_its_schema"'

[tool.cibuildwheel.linux]
environment = { TUYA_ENGINE_BUNDLED_LIBRARY = "prebuilt/libtuya_rule_engine.so" }
manylinux-x86_64-image = "manylinux_2_28"
manylinux-i686-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
manylinux-armv7l-image = "manylinux_2_31"
# Rust is cross-compiled on the runner first, including 32-bit musl targets.
musllinux-x86_64-image = "musllinux_1_2"
musllinux-i686-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
musllinux-armv7l-image = "musllinux_1_2"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
